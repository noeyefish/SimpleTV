<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ערוצי טלוויזיה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-sidebar: rgba(15, 20, 28, 0.85);
      --text-main: #ffffff;
      --text-muted: #8b949e;
      --accent: #3b82f6; /* Modern Blue */
      --accent-glow: rgba(59, 130, 246, 0.4);
      --card-bg: rgba(22, 27, 34, 0.6);
      --card-hover: rgba(33, 40, 48, 0.9);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Heebo', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Animated Dynamic Background */
    .bg-animated {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 10% 80%, rgba(59, 130, 246, 0.1), transparent 45%),
                  radial-gradient(circle at 90% 20%, rgba(99, 102, 241, 0.1), transparent 45%);
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    /* Sidebar (First in DOM, Right side due to RTL direction) */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background-color: var(--bg-sidebar);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.6);
      z-index: 10;
    }

    .sidebar-header {
      padding: 35px 24px 25px;
      border-bottom: 1px solid var(--glass-border);
      text-align: right;
    }

    .sidebar-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .sidebar-header p {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
    }

    .channel-list {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.25);
    }

    .channel-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 18px 20px;
      border-radius: 16px;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .channel-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: translateX(100%);
      transition: transform 0.6s;
    }

    .channel-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.15);
    }

    .channel-btn:hover::before {
      transform: translateX(-100%);
    }

    .channel-btn.active {
      background-color: rgba(59, 130, 246, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 10px 24px rgba(0,0,0,0.5);
    }

    .channel-btn .icon-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .channel-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: right;
    }

    .channel-title {
      line-height: 1.25;
    }

    .channel-epg {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 175px;
    }

    .channel-btn.active .channel-epg {
      color: #cbd5e1;
    }

    .channel-btn .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .channel-btn .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    .channel-btn.active .icon {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .live-badge {
      font-size: 0.75rem;
      background: #e55353;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.3s ease;
    }

    .channel-btn.active .live-badge {
      opacity: 1;
      transform: scale(1);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 83, 83, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(229, 83, 83, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 83, 83, 0); }
    }

    /* Main Content (Left side in RTL) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
      min-width: 0; /* Important for flex children with video */
    }

    .player-header {
      margin-bottom: 24px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
    }

    .player-header h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .current-program {
      display: none;
    }

    .current-program strong {
      color: #dbeafe;
      font-weight: 600;
    }

    .video-wrapper {
      flex: 1;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .video-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      border-radius: 24px;
      pointer-events: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* TV-style programme information overlay */
    .epg-overlay {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 7;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 30%);
      gap: 34px;
      align-items: end;
      padding: 72px 42px 30px;
      background: linear-gradient(to top, rgba(4, 7, 12, 0.96) 0%, rgba(4, 7, 12, 0.78) 58%, transparent 100%);
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .epg-overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .epg-toggle {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 8;
      width: 34px;
      height: 34px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      background: rgba(7, 10, 16, 0.48);
      color: rgba(255, 255, 255, 0.72);
      font-family: Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      cursor: pointer;
      opacity: 0.65;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .epg-toggle.available {
      display: flex;
    }

    .epg-toggle:hover,
    .epg-toggle:focus-visible,
    .epg-toggle.active {
      opacity: 1;
      color: #fff;
      background: rgba(59, 130, 246, 0.72);
      border-color: rgba(147, 197, 253, 0.85);
      outline: none;
    }

    .epg-toggle:active {
      transform: scale(0.94);
    }

    .epg-overlay-channel,
    .epg-next-label {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .epg-overlay-title {
      color: #fff;
      font-size: clamp(1.45rem, 3vw, 2.65rem);
      font-weight: 700;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }

    .epg-overlay-time,
    .epg-next-time {
      color: #cbd5e1;
      font-size: 1rem;
      margin-top: 8px;
      direction: ltr;
      text-align: right;
    }

    .epg-progress {
      width: 100%;
      height: 5px;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.2);
    }

    .epg-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.5s linear;
    }

    .epg-next {
      padding-right: 26px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      min-width: 0;
    }

    .epg-next-title {
      display: block;
      color: #e2e8f0;
      font-size: 1rem;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      color: var(--text-muted);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.8s ease;
    }

    .empty-state .icon-box {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: inset 0 4px 20px rgba(0,0,0,0.3);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 600;
    }

    .empty-state p {
      font-size: 1.1rem;
      max-width: 320px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loader */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 5;
    }

    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Mobile Responsive Support - Portrait Only */
    @media (max-width: 768px) and (orientation: portrait) {
      .app-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 45vh;
        border-left: none;
        border-top: 1px solid var(--glass-border);
        box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
      }
      .sidebar-header {
        padding: 20px 20px 15px;
      }
      .sidebar-header h1 {
        font-size: 1.5rem;
      }
      .channel-list {
        padding: 10px 20px 20px;
        gap: 12px;
      }
      .main-content {
        height: 55vh;
        padding: 15px;
      }
      .player-header {
        margin-bottom: 12px;
        min-height: 48px;
      }
      .player-header h2 {
        font-size: 1.4rem;
      }
      .current-program {
        font-size: 0.86rem;
      }
      .epg-overlay {
        grid-template-columns: 1fr;
        padding: 52px 20px 16px;
      }
      .epg-overlay-title {
        font-size: 1.35rem;
      }
      .epg-overlay-time {
        margin-top: 4px;
        font-size: 0.88rem;
      }
      .epg-progress {
        margin-top: 9px;
      }
      .epg-next {
        display: none;
      }
      .video-wrapper, .video-wrapper::after {
        border-radius: 16px;
      }
      .empty-state h3 {
        font-size: 1.4rem;
      }
      .empty-state p {
        font-size: 0.95rem;
      }
      .empty-state .icon-box {
        width: 70px;
        height: 70px;
      }
      .empty-state svg {
        width: 32px;
        height: 32px;
      }
    }

    /* Small/Medium Screens & Mobile Landscape */
    @media (max-width: 1024px) and (orientation: landscape) {
      .sidebar {
        width: 250px;
      }
      .sidebar-header {
        padding: 20px 15px 15px;
      }
      .sidebar-header h1 {
        font-size: 1.5rem;
      }
      .channel-list {
        padding: 15px;
      }
      .main-content {
        padding: 20px;
      }
      .channel-btn {
        padding: 12px 15px;
        font-size: 1.05rem;
      }
      .channel-btn .icon {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-animated"></div>

  <div class="app-container">
    
    <!-- Sidebar (Right) -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>ערוצי ישראל</h1>
        <p>בחר ערוץ מהרשימה</p>
      </div>
      <div class="channel-list" id="channelList">
        <!-- Buttons will be generated here -->
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="player-header">
        <h2 id="currentChannelTitle"></h2>
        <div class="current-program" id="currentProgram"></div>
      </div>
      <div class="video-wrapper" id="videoWrapper">
        <div class="empty-state" id="emptyState">
          <div class="icon-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
          </div>
          <h3>מתחם הצפייה מוכן</h3>
          <p>בחר ערוץ מהתפריט בצד ימין כדי להתחיל בצפייה ישירה באיכות גבוהה.</p>
        </div>
        <div class="loader" id="loader"></div>
        <video id="player" controls autoplay playsinline style="display: none;"></video>
        <button class="epg-toggle" id="epgToggle" type="button" title="פרטי התוכנית" aria-label="הצג פרטי תוכנית" aria-expanded="false">i</button>
        <div class="epg-overlay" id="epgOverlay" aria-live="polite">
          <div class="epg-current">
            <div class="epg-overlay-channel" id="epgOverlayChannel"></div>
            <div class="epg-overlay-title" id="epgOverlayTitle"></div>
            <div class="epg-overlay-time" id="epgOverlayTime"></div>
            <div class="epg-progress"><div class="epg-progress-bar" id="epgProgressBar"></div></div>
          </div>
          <div class="epg-next" id="epgNext">
            <div class="epg-next-label">אחר כך</div>
            <strong class="epg-next-title" id="epgNextTitle"></strong>
            <div class="epg-next-time" id="epgNextTime"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const channels = [
      { title: 'ערוץ 11', url: 'https://kancdn.medonecdn.net/livehls/oil/kancdn-live/live/kan11/live.livx/playlist.m3u8', logo: 'https://raw.githubusercontent.com/RokuIL/Live-From-Israel/master/Logos/Kan%2011.png', epgFile: 'Kan%2011.json' },
      { title: 'קשת 12', url: 'https://mako-streaming.akamaized.net/stream/hls/live/2033791/k12dvr/index.m3u8', logo: 'https://raw.githubusercontent.com/RokuIL/Live-From-Israel/master/Logos/Keshet%2012.png', epgFile: 'Keshet%2012.json' },
      { title: 'רשת 13', url: 'https://dsk76kvc9kie6.cloudfront.net/out/v1/2f2bc414a3db4698a8e94b89eaf2da2a/index_5.m3u8', logo: 'https://raw.githubusercontent.com/RokuIL/Live-From-Israel/master/Logos/Reshet%2013.jpg', epgFile: 'Reshet%2013.json' },
      { title: 'ערוץ 14', url: 'https://r.il.cdn-redge.media/livehls/oil/ch14/live/ch14/live.livx/playlist.m3u8', logo: 'https://www.c14.co.il/static/icons/c14.png' }
    ];

    const EPG_BASE_URL = 'https://raw.githubusercontent.com/RokuIL/Live-From-Israel/master/EPG/WGP/';

    const channelList = document.getElementById('channelList');
    const video = document.getElementById('player');
    const emptyState = document.getElementById('emptyState');
    const loader = document.getElementById('loader');
    const currentChannelTitle = document.getElementById('currentChannelTitle');
    const currentProgram = document.getElementById('currentProgram');
    const epgToggle = document.getElementById('epgToggle');
    const epgOverlay = document.getElementById('epgOverlay');
    const epgOverlayChannel = document.getElementById('epgOverlayChannel');
    const epgOverlayTitle = document.getElementById('epgOverlayTitle');
    const epgOverlayTime = document.getElementById('epgOverlayTime');
    const epgProgressBar = document.getElementById('epgProgressBar');
    const epgNext = document.getElementById('epgNext');
    const epgNextTitle = document.getElementById('epgNextTitle');
    const epgNextTime = document.getElementById('epgNextTime');
    let hls = null;
    let selectedChannel = null;
    let epgOverlayOpen = false;
    let epgAutoHideTimer = null;

    function setEpgOverlayOpen(isOpen) {
      epgOverlayOpen = Boolean(isOpen && selectedChannel);
      epgOverlay.classList.toggle('visible', epgOverlayOpen);
      epgToggle.classList.toggle('active', epgOverlayOpen);
      epgToggle.setAttribute('aria-expanded', String(epgOverlayOpen));
      epgToggle.setAttribute('aria-label', epgOverlayOpen ? 'הסתר פרטי תוכנית' : 'הצג פרטי תוכנית');
    }

    epgToggle.addEventListener('click', () => {
      if (epgAutoHideTimer) {
        clearTimeout(epgAutoHideTimer);
        epgAutoHideTimer = null;
      }
      setEpgOverlayOpen(!epgOverlayOpen);
    });

    function formatTime(date) {
      return new Intl.DateTimeFormat('he-IL', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: 'Asia/Jerusalem'
      }).format(date);
    }

    // The repository stores EPG timestamps as UTC but omits the trailing "Z".
    // Parse them explicitly as UTC; formatTime then displays them in Israel time.
    function parseEpgDate(value) {
      if (typeof value !== 'string') return new Date(NaN);
      const hasTimeZone = /(?:Z|[+-]\d{2}:?\d{2})$/i.test(value);
      return new Date(hasTimeZone ? value : `${value}Z`);
    }

    function getCurrentProgramme(channel) {
      if (!Array.isArray(channel.schedule)) return null;
      const now = new Date();
      return channel.schedule.find(item => {
        const start = parseEpgDate(item.start);
        const end = parseEpgDate(item.end);
        return !Number.isNaN(start.getTime()) && start <= now && now < end;
      }) || null;
    }

    function getNextProgramme(channel, current) {
      if (!current || !Array.isArray(channel.schedule)) return null;
      const currentIndex = channel.schedule.indexOf(current);
      if (currentIndex >= 0 && channel.schedule[currentIndex + 1]) {
        return channel.schedule[currentIndex + 1];
      }

      const currentEnd = parseEpgDate(current.end);
      return channel.schedule.find(item => parseEpgDate(item.start) >= currentEnd) || null;
    }

    function updateVideoOverlay(programme) {
      if (!selectedChannel) {
        epgOverlay.classList.remove('visible');
        return;
      }

      epgOverlayChannel.textContent = selectedChannel.title;

      if (!programme) {
        epgOverlayTitle.textContent = selectedChannel.epgLoading
          ? 'טוען לוח שידורים…'
          : 'אין מידע EPG זמין';
        epgOverlayTime.textContent = '';
        epgProgressBar.style.width = '0%';
        epgNext.style.display = 'none';
        return;
      }

      const start = parseEpgDate(programme.start);
      const end = parseEpgDate(programme.end);
      const duration = end - start;
      const progress = duration > 0
        ? Math.min(100, Math.max(0, ((Date.now() - start) / duration) * 100))
        : 0;

      epgOverlayTitle.textContent = programme.title;
      epgOverlayTime.textContent = `${formatTime(start)} - ${formatTime(end)}`;
      epgProgressBar.style.width = `${progress}%`;

      const nextProgramme = getNextProgramme(selectedChannel, programme);
      if (nextProgramme) {
        epgNext.style.display = '';
        epgNextTitle.textContent = nextProgramme.title;
        epgNextTime.textContent = `${formatTime(parseEpgDate(nextProgramme.start))} - ${formatTime(parseEpgDate(nextProgramme.end))}`;
      } else {
        epgNext.style.display = 'none';
      }
    }

    function getProgrammeText(programme) {
      if (!programme) return 'אין מידע EPG זמין';
      const start = formatTime(parseEpgDate(programme.start));
      const end = formatTime(parseEpgDate(programme.end));
      return `${programme.title} · ${start}–${end}`;
    }

    function updateChannelEpg(channel) {
      if (!channel.epgElement) return;
      const programme = getCurrentProgramme(channel);
      channel.epgElement.textContent = channel.epgLoading
        ? 'טוען לוח שידורים…'
        : getProgrammeText(programme);

      if (selectedChannel === channel) updateSelectedEpg();
    }

    function updateSelectedEpg() {
      if (!selectedChannel) {
        currentProgram.textContent = '';
        return;
      }

      const programme = getCurrentProgramme(selectedChannel);
      currentProgram.replaceChildren();
      updateVideoOverlay(programme);

      if (!programme) {
        currentProgram.textContent = selectedChannel.epgLoading
          ? 'טוען לוח שידורים…'
          : 'אין מידע EPG זמין לערוץ זה';
        return;
      }

      const title = document.createElement('strong');
      title.textContent = programme.title;
      currentProgram.append(title, ` · ${formatTime(parseEpgDate(programme.start))}–${formatTime(parseEpgDate(programme.end))}`);
    }

    async function loadChannelEpg(channel) {
      if (!channel.epgFile) {
        channel.epgLoading = false;
        updateChannelEpg(channel);
        return;
      }

      channel.epgLoading = true;
      updateChannelEpg(channel);

      try {
        const response = await fetch(`${EPG_BASE_URL}${channel.epgFile}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`EPG HTTP ${response.status}`);
        channel.schedule = await response.json();
      } catch (error) {
        console.error(`Failed to load EPG for ${channel.title}:`, error);
        channel.schedule = null;
      } finally {
        channel.epgLoading = false;
        updateChannelEpg(channel);
      }
    }

    async function initChannels() {
      const PRIMARY_URL = 'https://raw.githubusercontent.com/RokuIL/Live-From-Israel/refs/heads/master/Channels.json';
      const FALLBACK_URL = 'https://raw.githubusercontent.com/noeyefish/test/refs/heads/main/channels.json';

      try {
        let res = await fetch(PRIMARY_URL);
        if (!res.ok) res = await fetch(FALLBACK_URL);
        
        if (res.ok) {
          const data = await res.json();
          const allChannels = data.Channels || [];
          
          const ch12 = allChannels.find(c => c.Title === 'קשת 12' || c.TitleEng === 'Keshet 12');
          if (ch12 && ch12.StreamUrls && ch12.StreamUrls.length > 0) {
            let url = ch12.StreamUrls.find(u => !u.includes('@')) || ch12.StreamUrls[0];
            if (url && url.startsWith('http://')) {
              url = url.replace('http://', 'https://');
            }
            const localCh12 = channels.find(c => c.title === 'קשת 12');
            if (localCh12) {
              localCh12.url = url;
            }
          }
        }
      } catch (e) {
        console.error('Failed to fetch dynamic channel URLs:', e);
      }

      // Create buttons dynamically
      channels.forEach((channel) => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        
        btn.innerHTML = `
          <div class="icon-wrapper">
            <div class="icon">
              <img src="${channel.logo}" alt="${channel.title}" />
            </div>
            <div class="channel-copy">
              <span class="channel-title">${channel.title}</span>
              <span class="channel-epg">טוען לוח שידורים…</span>
            </div>
          </div>
          <span class="live-badge">LIVE</span>
        `;
        
        btn.onclick = () => playChannel(channel, btn);
        channel.epgElement = btn.querySelector('.channel-epg');
        channelList.appendChild(btn);
      });

      channels.forEach(loadChannelEpg);
    }

    initChannels();

    function playChannel(channel, buttonElement) {
      // Toggle active states
      document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
      if (buttonElement) buttonElement.classList.add('active');

      // Update UI
      selectedChannel = channel;
      epgToggle.classList.add('available');
      if (epgAutoHideTimer) clearTimeout(epgAutoHideTimer);
      setEpgOverlayOpen(true);
      epgAutoHideTimer = setTimeout(() => {
        setEpgOverlayOpen(false);
        epgAutoHideTimer = null;
      }, 2500);
      currentChannelTitle.textContent = channel.title;
      updateSelectedEpg();
      emptyState.style.display = 'none';
      video.style.display = 'block';
      loader.style.display = 'block';

      // Destroy old instance if exists
      if (hls) {
        hls.destroy();
        hls = null;
      }
      
      // Reset native video to clear old resources
      video.pause();
      video.removeAttribute('src');
      video.load();

      // Load new stream using HLS.js
      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loader.style.display = 'none';
          video.play().catch(e => console.error("Playback failed:", e));
        });
        
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.error("HLS fatal error:", data);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                loader.style.display = 'none';
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Fallback for Safari natively supporting HLS
        video.src = channel.url;
        video.onloadedmetadata = () => {
          loader.style.display = 'none';
          video.play().catch(e => console.error("Playback failed:", e));
        };
        video.onerror = (e) => {
          console.error("Native playback error:", e);
          loader.style.display = 'none';
        };
      }
    }

    // Keep the current-program indicator accurate when a programme changes.
    setInterval(() => channels.forEach(updateChannelEpg), 30000);

    // Refresh the source periodically so schedule updates appear without reloading the page.
    setInterval(() => channels.forEach(loadChannelEpg), 15 * 60 * 1000);
  </script>
</body>
</html>
